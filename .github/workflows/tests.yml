# Runs the tests on GitHub every time you push. A green tick on your repo
# shows recruiters the code works.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - name: Run on the sample data
        run: |
          python billhound.py sample_data/normal_month.csv
          # The compromised file should exit with code 1 (HIGH findings)
          python billhound.py sample_data/compromised_month.csv || test $? -eq 1
